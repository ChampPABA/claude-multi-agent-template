# PROJECT_STATUS.yml
# Cross-session context for Claude - update after significant milestones
# Optional: Remove this file if your project doesn't need cross-session tracking
#
# WHY this file exists:
# - New Claude sessions lose context about infrastructure state, blockers, and priorities
# - Reading multiple files (README, archived proposals, tasks.md) wastes tokens
# - This single file provides quick context snapshot for AI sessions
#
# v2.2.0 (claude-mem integration):
# - REMOVED: decisions, notes, future_ideas → claude-mem handles automatically
# - KEPT: blockers, priorities, technical_debt → requires human decision
# - Query past decisions: ask Claude "what decisions about X?" → mem-search auto-invoked

last_updated: "YYYY-MM-DD"

# Optional settings
_config:
  stale_warning_days: 7  # Suggest /pstatus review if older than this

# -------------------------------------------------------------------
# CURRENT FOCUS
# What phase is the project in? What's actively being worked on?
# -------------------------------------------------------------------
current_focus:
  description: "Brief description of current project phase"
  active_change: null  # change-id if OpenSpec change in progress, null if between changes

# -------------------------------------------------------------------
# COMPLETED CHANGES
# Recently shipped work - helps Claude understand what's already done
# -------------------------------------------------------------------
completed_changes: []
  # Example:
  # - id: auth-system
  #   date: "2025-11-30"
  #   summary: "Login/logout, JWT tokens, protected routes"
  # - id: infrastructure-cicd
  #   date: "2025-11-28"
  #   summary: "Docker, CI/CD pipeline, Cloudflare Tunnel"

# -------------------------------------------------------------------
# INFRASTRUCTURE STATUS
# Current state of services - helps Claude understand what's running
# -------------------------------------------------------------------
infrastructure: {}
  # Example structure (customize for your project):
  #
  # database:
  #   status: healthy  # healthy | degraded | down | not_setup
  #   notes: "PostgreSQL, 4 tables deployed"
  #
  # api:
  #   status: healthy
  #   notes: "6 endpoints, running on port 3000"
  #
  # cloudflare_tunnel:
  #   status: running
  #   waiting_for: domain  # null if fully operational
  #   notes: "Tunnel active, pending domain configuration"
  #
  # Status values: healthy, degraded, down, not_setup, waiting

# -------------------------------------------------------------------
# BLOCKERS
# External dependencies blocking progress
# Claude will avoid suggesting work that's blocked
# -------------------------------------------------------------------
blockers: []
  # Example:
  # - id: domain-config
  #   description: "Need domain for Cloudflare public routes"
  #   blocks: [production-launch, ssl-setup]
  #
  # - id: stripe-api-key
  #   description: "Waiting for Stripe test API key from finance team"
  #   blocks: [payment-integration]

# -------------------------------------------------------------------
# PENDING FOLLOW-UPS
# Non-Goals from archived changes that need separate proposals
# Captured when: archiving a change with Non-Goals marked "separate proposal"
# Claude will warn during /csetup if new change relates to pending items
# -------------------------------------------------------------------
pending_followups: []
  # Example:
  # - item: "Database migration strategy"
  #   from_change: "add-infrastructure-cicd"
  #   reason: "Non-Goal: Database migrations (แยก proposal)"
  #   affects: ["any change with DB schema changes"]
  #   date: "2025-11-30"
  #
  # - item: "API rate limiting"
  #   from_change: "add-auth-system"
  #   reason: "Non-Goal: Rate limiting (phase 2)"
  #   affects: ["public API endpoints"]
  #   date: "2025-12-01"

# -------------------------------------------------------------------
# NEXT PRIORITIES
# What should be worked on next (with reasoning)
# Helps Claude suggest appropriate next steps
# -------------------------------------------------------------------
next_priorities: []
  # Example:
  # - id: payment-integration
  #   reason: "Revenue blocker - needed before launch"
  #
  # - id: user-profile
  #   reason: "Dependency for RIASEC save feature"

# -------------------------------------------------------------------
# TECHNICAL DEBT
# Known issues to fix later
# Captured from: "ต้องแก้...", "should refactor...", "tech debt...", "needs cleanup..."
# -------------------------------------------------------------------
technical_debt: []
  # Example:
  # - item: "Refactor auth middleware"
  #   reason: "Duplicated logic in 3 places"
  #   priority: medium  # low, medium, high
  #
  # - item: "Add proper error boundaries"
  #   reason: "Currently crashes on API errors"
  #   priority: high

# -------------------------------------------------------------------
# REFERENCES (optional)
# Quick links to important project files
# -------------------------------------------------------------------
references:
  # roadmap: "docs/proposal_list.md"
  # architecture: "openspec/specs/architecture.md"
  # design_tokens: "design-system/data.yaml"

# -------------------------------------------------------------------
# QUERYING PAST CONTEXT (claude-mem)
# -------------------------------------------------------------------
# These fields were REMOVED because claude-mem handles them automatically:
# - decisions → Query: "what decisions about X?"
# - notes/learnings → Query: "what did we learn about X?"
# - future_ideas → Query: "what ideas for X?"
#
# claude-mem auto-captures observations from tool usage.
# Just ask naturally - mem-search skill is auto-invoked.
