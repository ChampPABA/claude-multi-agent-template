name: Deploy API

on:
  push:
    branches: [main, development]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/acme-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
            git pull
            docker compose build api
            docker compose up -d
            docker compose run -T --rm api bun run db:migrate
